name: Update sky

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sky
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render images for the current time and weather in Munich
        run: python .github/scripts/sky.py "$RUNNER_TEMP/output"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish to the output branch
        run: |
          if [ ! -f "$RUNNER_TEMP/output/hero.svg" ]; then
            echo "Nothing rendered this hour; the current images stay published."
            exit 0
          fi
          cd "$RUNNER_TEMP/output"
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore: update sky"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
